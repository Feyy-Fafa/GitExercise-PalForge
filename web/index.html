<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PalForge Crafting Calculator</title>
    <link rel="stylesheet" href="style.css">
    <script type="text/javascript" src="/eel.js"></script>
    <script src="app.js" defer></script>
</head>
<body>
    <nav class="navbar">
        <div class="logo">
            <img src="logo.png" alt="PalForge Logo" class="logo-image">
            PalForge
        </div>
        <div class="nav-links">
            <a href="#" class="active">Calculator</a>
            <a href="#">Drop Source Maps</a>
        </div>
    </nav>

    <main class="dashboard-grid">
        
        <section class="panel">
            <div class="panel-header">
                <h2>Item Database</h2>
                <p class="subtitle">Search and add items to your queue</p>
            </div>
            <div class="search-controls">
                <input type="text" id="search-bar" placeholder="Search (e.g., Pal Metal Armor)...">
                <select id="category-filter">
                    <option value="all">All Categories</option>
                    <option value="spheres">Spheres</option>
                    <option value="weapons">Weapons</option>
                    <option value="armor">Armor</option>
                </select>
            </div>
            <div class="scroll-container" id="item-results">
                <div class="placeholder-text">Type to search the database...</div>
            </div>
        </section>

        <section class="panel queue-panel">
            <div class="panel-header">
                <h2>Active Build Queue</h2>
                <p class="subtitle">Adjust quantities and priorities</p>
            </div>
            <div class="scroll-container" id="build-queue">
                <div class="placeholder-text">Your queue is empty.</div>
            </div>
            <button class="btn-primary" id="calculate-btn">Calculate Base Materials</button>
        </section>

        <section class="panel results-panel">
            <div class="panel-header">
                <h2>Recipe Tree</h2>
                <p class="subtitle">Hierarchical material breakdown</p>
            </div>
            <div class="scroll-container" id="material-breakdown" style="justify-content: flex-start;">
                <!-- M3 Engine will dynamically inject the generated tree nodes here! -->
            </div>
        </section>

    </main>
</body>
</html>
